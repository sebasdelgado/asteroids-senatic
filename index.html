<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids — Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="login-box">

    <h1>☄️ ASTEROIDS</h1>
    <p class="subtitle">Inicia sesión para guardar tu puntaje</p>

    <div id="login-error" class="error hidden"></div>

    <input id="username" type="text"     placeholder="Usuario"    autocomplete="username" />
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" />

    <div class="btn-row">
      <button id="btn-login">Entrar</button>
      <button id="btn-register" class="secondary">Registrarse</button>
    </div>

    <button id="btn-guest" class="ghost">Jugar como invitado</button>

  </div>

  <script src="src/ui/login.js"></script>

</body>
</html>
