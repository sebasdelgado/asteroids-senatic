<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroids — Mi Perfil</title>

  <link rel="stylesheet" href="../styles.css" />

</head>
<body>

  
  <div class="profile-box">

    <div id="profile-header">
      <h2 id="profile-username">—</h2>
      <span class="profile-tag">Jugador</span>
    </div>

    <div class="stats-grid">

      <div class="stat">
        <span class="stat-label">Mejor puntaje</span> 
        <span class="stat-value" id="best-score">—</span>   

      </div>

      <div class="stat">
        <span class="stat-label">Nivel máximo</span>  
        <span class="stat-value" id="best-level">—</span>

      </div>

      <div class="stat">
        <span class="stat-label">Partidas jugadas</span>
        <span class="stat-value" id="total-games">—</span>
      </div>

      <div class="stat">
        <span class="stat-label">Puntaje promedio</span>   
        <span class="stat-value" id="avg-score">—</span> 
      </div>

    </div>

    <h3 class="section-title">Últimas partidas</h3>
    <div id="history-content">Cargando…</div>

    <div class="btn-col">

      <button id="btn-home">🏠 Inicio</button>
      <button id="btn-play" class="secondary" >▶ Jugar</button>
      <button id="btn-leaderboard" class="secondary">🏆 Tabla de puntajes</button>
      <button id="btn-rankings" class="secondary">📊 Rankings</button> 
      <button id="btn-achievements" class="secondary">🎖️ Mis logros</button>
      <button id="btn-logout" class="ghost">Cerrar sesión</button>

    </div>
    
  </div>

  <script type="module" src="../src/ui/profile.js"></script>

</body>
</html>
