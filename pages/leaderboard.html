  <!--
  ╔══════════════════════════════════════════════════════════════╗

  ║  Crea un <div> con clase "lb-box" que contenga:             ║
  ║                                                              ║
  ║  1. Un <h2> con el texto: 🏆 Tabla de puntajes              ║
  ║                                                              ║
  ║  2. Un <div> con id="lb-content" y texto "Cargando…"        ║

  ╚══════════════════════════════════════════════════════════════╝

  <!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  TODO #3 — Agregar los botones de navegación                ║

  ║  Dentro del div.lb-box agrega un <div> con clase            ║
  ║  "lb-actions" que contenga CUATRO botones:                  ║
  ║                                                              ║
  ║  Botón 1:  id="btn-home"                                    ║
  ║            texto → "🏠 Inicio"                              ║
  ║            (sin clase especial = botón blanco primario)      ║
  ║                                                              ║
  ║  Botón 2:  id="btn-rankings"  clase="secondary"             ║
  ║            texto → "📊 Rankings"                            ║
  ║                                                              ║
  ║  Botón 3:  id="btn-profile"   clases="secondary hidden"     ║
  ║            texto → "👤 Mi perfil"                           ║
  ║            (empieza oculto; el JS lo muestra si hay sesión) ║
  ║                                                              ║
  ║  Botón 4:  id="btn-logout"    clases="secondary hidden"     ║
  ║            texto → "Cerrar sesión"                          ║
  ║            (también empieza oculto)                         ║
  ╚══════════════════════════════════════════════════════════════╝
  -->

  <!--
  ╔══════════════════════════════════════════════════════════════╗

  ║                                                              ║
  ║  Ruta: ../src/ui/leaderboard.js                             ║
  ║                                                              ║
  ║  ⚠️  IMPORTANTE: este archivo SÍ usa import/export          ║
  ║  (importa requireLogin de auth-guard.js).                    ║

  ║                                                              ║
  ║  Usa: <script type="module" src="../src/ui/leaderboard.js"> ║
  ║        </script>                                            ║
  ╚══════════════════════════════════════════════════════════════╝
  -->
