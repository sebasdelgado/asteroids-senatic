<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>Asteroids — Rankings</title>

</head>
<body>

  <div class="lb-box">

    <h2>📊 Rankings</h2>

    <div class="filter-row">

    <div class="lb-actions">
      <button id="btn-home"    >🏠 Inicio</button>

    </div>

  </div>

  <script src="../src/ui/rankings.js"></script>
